# template-version: 3
name: CI

# Standard-CI für App-Repos der Plattform. Wird beim Projekt-Anlegen von
# /admin/projects automatisch nach .gitea/workflows/ci.yml committed.
#
# Die Jobs sind defensiv gebaut: sie laufen auch in einem frisch angelegten,
# leeren Repo grün durch. Sobald ein Entwickler Python-Code oder Tests
# ergänzt, greifen die Scanner automatisch. Ab dem Zeitpunkt sollte die
# Pipeline auch so bleiben -- rote Befunde sind echte Treffer, nicht
# Template-Rauschen.
#
# Analoge Jobs zum Plattform-Repo (intranet-platform). Wenn sich dort die
# CI ändert, lohnt sich ein Abgleich -- das Template hier wird nicht
# automatisch mitgezogen.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Alle pip-Installationen laufen ueber den plattform-internen PyPI-Proxy
# (proxpi, Service pypi-proxy auf Host-Port 5000). Damit haengt die CI nicht
# mehr am flakigen Internet-Egress: erstmalig gezogene Wheels cached der
# Proxy, jeder Folge-Lauf ist LAN-Tempo. PIP_TRUSTED_HOST erlaubt das
# Plain-HTTP-LAN-Ziel; Timeout/Retries fangen den kalten Erstabruf ab.
# Siehe runbooks/pypi-proxy.md.
env:
  PIP_INDEX_URL: "http://192.168.178.201:5000/index/"
  PIP_TRUSTED_HOST: "192.168.178.201"
  PIP_RETRIES: "10"
  PIP_DEFAULT_TIMEOUT: "60"

jobs:

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen, ob Tests existieren
        id: has_tests
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Keine tests/test_*.py gefunden -- pytest wird übersprungen."
          fi
      - name: Dependencies installieren
        if: steps.has_tests.outputs.present == 'true'
        # App-Dependencies zuerst (sonst scheitert der Import in den
        # Tests), dann Dev-Dependencies drauf. pytest am Ende als
        # Fallback — wenn es schon in requirements drin ist, ist pip3
        # idempotent und tut nichts Weiteres.
        run: |
          if [ -f requirements.txt ];     then pip3 install --break-system-packages --ignore-installed -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip3 install --break-system-packages --ignore-installed -r requirements-dev.txt; fi
          pip3 install --break-system-packages --ignore-installed pytest
      - name: Tests laufen lassen
        if: steps.has_tests.outputs.present == 'true'
        run: pytest

  bandit:
    name: bandit (Python-SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen, ob Python-Code existiert
        id: has_python
        run: |
          if find . \( -path ./tests -o -path ./migrate \) -prune -o -name '*.py' -print | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Kein Python-Code gefunden -- Bandit wird übersprungen."
          fi
      - name: Bandit installieren
        if: steps.has_python.outputs.present == 'true'
        run: pip3 install --break-system-packages --ignore-installed "bandit==1.8.0"
      - name: Scan
        if: steps.has_python.outputs.present == 'true'
        # B101 (assert_used) ist in Tests- und FastAPI-Code normal -- skip.
        # migrate/ enthält Alt-Code während Migrationen (siehe Anleitung
        # „Weiteres Projekt starten"), wird per Konvention nicht gescannt
        # und am Ende der Migration gelöscht.
        run: bandit -r . --skip B101 --exclude ./tests,./migrate -q

  semgrep:
    name: semgrep (Cross-Language-SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep installieren
        run: pip3 install --break-system-packages --ignore-installed setuptools "semgrep==1.99.0"
      - name: Scan
        # --error: bei Findings exit != 0 (Pipeline rot)
        # auto-Konfig zieht passende Regeln aus dem Code-Inhalt
        # Ein leeres Repo lässt semgrep sauber durchlaufen.
        # migrate/ ist während einer laufenden Migration Alt-Code, der
        # laut new-project.md nicht mehr verändert werden soll. Bandit
        # und Trivy excluden es schon, semgrep jetzt auch — sonst
        # entsteht systematisches Rauschen.
        run: semgrep --config=auto --error --skip-unknown-extensions --exclude=migrate/

  trivy-fs:
    name: trivy (Filesystem + Dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy installieren
        run: |
          curl -fsSL -o /tmp/trivy.tgz \
            https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: Scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --skip-dirs tests,secrets,migrate \
            .

  build-image:
    name: build-image (Container Registry)
    runs-on: ubuntu-latest
    needs: [pytest, bandit, semgrep, trivy-fs]
    # Nur auf main-Push bauen und pushen. PRs bauen ein Image lokal,
    # pushen es aber nicht (das wäre doppelt und würde Package-Rauschen erzeugen).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen, ob Dockerfile vorhanden
        id: has_dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Kein Dockerfile -- build-image wird übersprungen."
          fi
      - name: Buildx einrichten
        if: steps.has_dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          # driver=docker benutzt den Host-Docker-Daemon direkt statt einen
          # eigenen BuildKit-Container. Dadurch erbt der Build die insecure-
          # registries-Config aus /etc/docker/daemon.json und erreicht auch
          # die LAN-IP 192.168.178.201:3000 ohne Netz-Umweg. Kosten: Layer-
          # Cache in der Registry (cache-from/-to) fällt weg. Fliegt mit
          # Phase 2 (TLS + Subdomain) wieder raus.
          driver: docker
      - name: Registry-Login (Gitea Container Registry)
        if: steps.has_dockerfile.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          # REGISTRY_HOST ist hart gesetzt, weil Gitea 1.23 die Actions-Variables-
          # API noch nicht anbietet. Sobald Subdomain + TLS stehen (Phase 2),
          # hier auf https://git.office.hotelfriend.com umstellen und gleichzeitig
          # in daemon.json den insecure-registries-Eintrag entfernen.
          registry: 192.168.178.201:3000
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Bauen und pushen
        if: steps.has_dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Der Image-Build zieht seine Python-Deps ueber denselben LAN-Proxy
          # wie die Host-Tests. Das App-Dockerfile (Skeleton) wertet diese
          # Build-Args aus; fehlen sie, faellt pip auf pypi.org zurueck.
          build-args: |
            PIP_INDEX_URL=http://192.168.178.201:5000/index/
            PIP_TRUSTED_HOST=192.168.178.201
          # Zwei Tags: voller SHA für eindeutige Deploys, :latest für Bequemlichkeit.
          # Die Plattform deployed nur gegen den SHA-Tag, :latest ist ein Hint.
          tags: |
            192.168.178.201:3000/${{ github.repository }}:${{ github.sha }}
            192.168.178.201:3000/${{ github.repository }}:latest
